[package]
name = "holdr"
version = "0.1.0"
description = "Holdr – private, local-first stock portfolio tracker"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "holdr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Without the default "cookies" feature: chart and search requests need no
# cookies, so none are stored. The quote summary session lives in `yahoo.rs`.
tauri-plugin-http = { version = "2", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "system-proxy",
    "unsafe-headers",
] }
# Same version as tauri-plugin-http; cookies are kept in memory only.
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
